# Builds Write (FS Office Write) for the Mac App Store and uploads it to App Store Connect, and
# fills in its App Store listing (names, descriptions, keywords, categories, age rating, review
# contact) from packaging/macos/appstore/metadata and rating.json.
# Run by hand: Actions › "App Store (Write for Mac)" › Run workflow. Only Write; Table isn't part
# of it. See docs/appstore/README.md for the certificates, profile and API key this needs; the
# listing needs only the API key.
#
# Secrets (Settings › Secrets and variables › Actions):
#   APPSTORE_APP_CERT_P12        base64 of the "Apple Distribution" certificate exported as .p12
#   APPSTORE_INSTALLER_CERT_P12  base64 of the "Mac Installer Distribution" certificate as .p12
#   APPSTORE_CERT_PASSWORD       the password both .p12 files were exported with
#   APPSTORE_PROFILE             base64 of the "Mac App Store Connect" provisioning profile
#   APPSTORE_API_KEY_ID          App Store Connect API key: Key ID
#   APPSTORE_API_ISSUER          App Store Connect API key: Issuer ID
#   APPSTORE_API_KEY_P8          App Store Connect API key: the AuthKey_….p8 file's text
name: App Store (Write for Mac)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID registered for Write"
        default: "com.fantasticsoftware.write"
        required: true
      version:
        description: "Version shown in the App Store (the version being prepared in App Store Connect)"
        default: "1.0"
        required: true
      listing:
        description: "Fill in the App Store listing from the repository"
        type: boolean
        default: true
      build:
        description: "Build Write"
        type: boolean
        default: true
      upload:
        description: "Upload the build to App Store Connect (otherwise only keep the .pkg)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  listing:
    if: ${{ inputs.listing }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: fastlane
        run: gem install fastlane --no-document
      - name: Upload the listing
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION: ${{ inputs.version }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          set -euo pipefail
          for v in API_KEY_ID API_ISSUER API_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing (see docs/appstore/README.md)"; exit 1; }
          done
          KEY="$RUNNER_TEMP/asc-key.json"
          jq -n --arg id "$API_KEY_ID" --arg iss "$API_ISSUER" --arg key "$API_KEY_P8" \
            '{key_id: $id, issuer_id: $iss, key: $key, in_house: false}' > "$KEY"
          # From the folder that holds metadata/, so deliver doesn't offer to set itself up.
          cd packaging/macos/appstore
          fastlane deliver --api_key_path "$KEY" --platform osx \
            --app_identifier "$BUNDLE_ID" --app_version "$VERSION" \
            --metadata_path metadata --app_rating_config_path rating.json \
            --skip_binary_upload true --skip_screenshots true \
            --submit_for_review false --run_precheck_before_submit false --force true
          rm -f "$KEY"

  appstore:
    if: ${{ inputs.build }}
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: appstore-universal
      - name: Certificates, profile and API key
        env:
          APP_CERT: ${{ secrets.APPSTORE_APP_CERT_P12 }}
          INSTALLER_CERT: ${{ secrets.APPSTORE_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPSTORE_PROFILE }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for v in APP_CERT INSTALLER_CERT PROFILE; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing (see docs/appstore/README.md)"; exit 1; }
          done
          KC="$RUNNER_TEMP/appstore.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          for cert in APP_CERT INSTALLER_CERT; do
            # Spaces and line breaks from copying are dropped; anything else that isn't base64
            # names the secret to paste again.
            printf '%s' "${!cert}" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/$cert.p12" 2>/dev/null \
              || { echo "::error::secret for $cert is not base64 of a .p12 file: copy it again with base64 -i <file> | pbcopy"; exit 1; }
            [ -s "$RUNNER_TEMP/$cert.p12" ] || { echo "::error::secret for $cert decodes to nothing"; exit 1; }
            security import "$RUNNER_TEMP/$cert.p12" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security -f pkcs12 -k "$KC" \
              || { echo "::error::$cert could not be opened: is APPSTORE_CERT_PASSWORD the password it was exported with?"; exit 1; }
            rm -f "$RUNNER_TEMP/$cert.p12"
          done
          # Apple's intermediate certificates, without which a distribution certificate isn't
          # valid on a machine that hasn't had Xcode sign with it.
          for ca in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
              && security import "$RUNNER_TEMP/$ca.cer" -k "$KC" >/dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Names stay out of the log (it's public); only what was found is said.
          IDS="$(security find-identity -v "$KC" || true)"
          APP_ID="$(printf '%s\n' "$IDS" | grep -E '"(Apple Distribution|3rd Party Mac Developer Application)' | head -1 | awk '{print $2}' || true)"
          INSTALLER="$(printf '%s\n' "$IDS" | grep -E 'Installer' | head -1 | sed -E 's/^ *[0-9]+\) [0-9A-F]+ "(.*)"$/\1/' || true)"
          echo "valid signing identities: $(printf '%s\n' "$IDS" | grep -cE '^ *[0-9]+\)' || true)"
          [ -n "$APP_ID" ] || { echo "::error::no valid Apple Distribution identity in APPSTORE_APP_CERT_P12 (export it with its key, from My Certificates, as .p12)"; exit 1; }
          [ -n "$INSTALLER" ] || { echo "::error::no valid Mac Installer Distribution identity in APPSTORE_INSTALLER_CERT_P12 (export it with its key, from My Certificates, as .p12)"; exit 1; }
          printf '%s' "$PROFILE" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/write.provisionprofile" 2>/dev/null \
            || { echo "::error::secret APPSTORE_PROFILE is not base64 of the .provisionprofile: copy it again with base64 -i <file> | pbcopy"; exit 1; }
          if [ -n "$API_KEY_ID" ] && [ -n "$API_KEY_P8" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            printf '%s\n' "$API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          fi
          {
            echo "APPSTORE_APP_IDENTITY=$APP_ID"
            echo "APPSTORE_INSTALLER_IDENTITY=$INSTALLER"
            echo "APPSTORE_PROFILE=$RUNNER_TEMP/write.provisionprofile"
          } >> "$GITHUB_ENV"
      - name: Build, sign and package Write
        env:
          APPSTORE_BUNDLE_ID: ${{ inputs.bundle_id }}
          APPSTORE_VERSION: ${{ inputs.version }}
          APPSTORE_BUILD_NUMBER: ${{ github.run_number }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
          DIST: ${{ github.workspace }}/out
        run: |
          if [ "${{ inputs.upload }}" = "true" ]; then
            bash packaging/macos/appstore/build.sh --upload
          else
            bash packaging/macos/appstore/build.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: write-appstore-pkg
          path: out/*.pkg
